[build]
  command="npm run build"
  publish="/dist"
  base="/"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from="/*"
  to="/index.html"
  status="200"

# Security headers (owner QA standard; keep securityheaders.com passing).
# Netlify serves HTTPS only, so HSTS is safe to preload. The CSP allows
# Firebase (Firestore, Auth, Storage, Functions), reCAPTCHA (required by
# Firebase App Check; blocking it stalls Firestore, App Check never
# produces a token and the SDK waits on it), the hashed inline boot-script
# in index.html (non-home routes strip the hero shell), and inline styles
# (Mantine/Emotion inject style tags at runtime). Fonts are self-hosted,
# so no Google origins are needed. When adding a new third-party origin,
# extend the matching CSP directive here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-6/JYtGsy621iUFICUYWGttfy5d93YyJ13HjEuPOdBxY=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.paypalobjects.com https://www.paypal.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https: wss:; frame-src 'self' https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.paypal.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://www.paypal.com; upgrade-insecure-requests"
    X-XSS-Protection = "0"

# Forums, threads, and member profiles are never crawlable or indexable, by
# anyone: robots.txt blocks crawling, this header blocks indexing even for
# bots that fetch anyway (it is served before any JavaScript runs), and the
# pages also emit noindex meta.
[[headers]]
  for = "/Forum/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/Users/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# S.N.A.G. (the member help chat) is login-gated and never indexable: header +
# robots.txt disallow + noindex meta, same belt-and-braces as the forums.
[[headers]]
  for = "/SNAG"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long-lived caching for fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site images (homepage hero, team photo): cached a week, revalidated after.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Keep crawler files fresh.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-pages.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-blog.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
