name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The runner default is Node 20, but functions/package.json requires
      # Node 22 (same as Netlify and the deployed runtime).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Lint
        run: npx eslint src

      - name: Functions typecheck
        working-directory: functions
        run: |
          npm ci
          npm run build
